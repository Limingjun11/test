name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip qemu-utils

      - name: Run build script
        run: |
          chmod +x main.sh
          ./main.sh

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v22.2-qcow2
          name: v22.2-qcow2
          files: |
            vda_arm64only.qcow2
            vdb_arm64only.qcow2
