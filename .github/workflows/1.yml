name: Convert Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install qemu-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils

      - name: Download and Convert
        run: |
          echo "下载中..."
          wget -c "https://github.com/jqssun/android-lineage-qemu/releases/download/v2025.10.11/UTM-VM-lineage-22.2-20251011-jqssun-virtio_arm64only.zip" -O utm.zip
          
          echo "解压中..."
          mkdir -p extract
          unzip -o utm.zip -d extract
          
          echo "=== 解压后的文件列表 ==="
          find extract -type f
          
          VDA_FILE=$(find extract -type f -name "vda*" | head -n 1)
          VDB_FILE=$(find extract -type f -name "vdb*" | head -n 1)
          
          if [ -z "$VDA_FILE" ] || [ -z "$VDB_FILE" ]; then
            echo "❌ 严重错误: 没找到 vda 或 vdb 文件，请检查下载的 zip 是否完整！"
            exit 1
          fi
          
          echo "✅ 找到 VDA: $VDA_FILE"
          echo "✅ 找到 VDB: $VDB_FILE"
          
          # 判断后缀名来进行转换
          if [[ "$VDA_FILE" == *.qcow2 ]]; then
            cp "$VDA_FILE" ./vda_arm64only.qcow2
          else
            echo "转换 VDA 为 qcow2 格式中..."
            qemu-img convert -f raw -O qcow2 -c "$VDA_FILE" ./vda_arm64only.qcow2
          fi

          if [[ "$VDB_FILE" == *.qcow2 ]]; then
            cp "$VDB_FILE" ./vdb_arm64only.qcow2
          else
            echo "转换 VDB 为 qcow2 格式中..."
            qemu-img convert -f raw -O qcow2 -c "$VDB_FILE" ./vdb_arm64only.qcow2
          fi
          
          echo "最终产物："
          ls -lh *.qcow2

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v22.2-qcow2
          name: v22.2-qcow2
          files: |
            vda_arm64only.qcow2
            vdb_arm64only.qcow2
